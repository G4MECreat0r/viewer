<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LocShare 発行</title>
<style>
  *{box-sizing:border-box}
  body{font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:#0b1220;color:#e2e8f0;
    margin:0;padding:24px 16px 60px;line-height:1.6}
  .wrap{max-width:520px;margin:0 auto}
  h1{font-size:18px;font-weight:600;margin:0 0 6px}
  .lead{font-size:13px;opacity:.7;margin:0 0 18px}
  input{font:inherit;font-size:13px;padding:9px 10px;border-radius:8px;border:1px solid #334155;
    background:#0f172a;color:#e2e8f0;width:100%}
  button{font:inherit;font-size:13px;padding:9px 16px;border-radius:8px;border:1px solid #2563eb;
    background:#2563eb;color:#fff;cursor:pointer;white-space:nowrap}
  button.ghost{background:#1e293b;border-color:#334155}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .row input{flex:1;min-width:120px}
  .card{border:1px solid #1e293b;border-radius:12px;padding:14px;margin-top:16px;background:#0f172a}
  .lbl{font-size:11px;opacity:.6;margin:0 0 6px}
  .nm{font-size:14px;font-weight:600;margin-bottom:12px}
  a.big{display:block;padding:14px;border-radius:10px;background:#2563eb;color:#fff;text-decoration:none;
    text-align:center;font-size:14px;font-weight:600;margin-bottom:14px}
  a.alt{background:#1e293b;border:1px solid #334155}
  .urlbox{display:flex;gap:6px;align-items:center;margin-bottom:14px}
  .urlbox input{font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .sub{font-size:11px;opacity:.5;margin:-8px 0 14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>LocShare 発行</h1>
  <p class="lead">相手の名前を入れて発行 → プロファイルを送るだけ。</p>

  <div class="row">
    <input id="name" placeholder="相手の名前（例: 太郎）" maxlength="20">
    <button id="make">発行</button>
  </div>
  <div class="row">
    <input id="lat" placeholder="緯度（任意・誤魔化す場合）">
    <input id="lng" placeholder="経度（任意・誤魔化す場合）">
  </div>

  <div id="out" class="card" style="display:none">
    <div class="nm" id="who"></div>

    <div class="lbl">プロファイルURL</div>
    <div class="urlbox">
      <input id="profileUrl" readonly>
      <button class="ghost" id="copy">コピー</button>
    </div>
    <a class="big" id="profile" href="#" download>プロファイルをダウンロード</a>

    <div class="lbl">監視画面URL</div>
    <div class="urlbox">
      <input id="watchUrl" readonly>
      <button class="ghost" id="copy2">コピー</button>
    </div>
    <a class="big alt" id="watch" href="#" target="_blank">監視画面を開く</a>
    <div class="sub" id="mode"></div>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const genKey = () => Math.random().toString(36).slice(2, 6) + Math.random().toString(36).slice(2, 6);

  function copy(text, btn) {
    const done = () => { const t = btn.textContent; btn.textContent = "コピー済"; setTimeout(() => { btn.textContent = t; }, 1200); };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, done); else done();
  }

  $("make").onclick = async () => {
    const name = ($("name").value || "相手").slice(0, 20);
    const lat = $("lat").value.trim();
    const lng = $("lng").value.trim();
    const k = genKey();
    const base = location.origin;

    try {
      await fetch("/api/room", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ k, name })
      });
    } catch (e) {}

    let purl = base + "/profile.mobileconfig?k=" + k + "&name=" + encodeURIComponent(name);
    if (lat && lng) purl += "&lat=" + encodeURIComponent(lat) + "&lng=" + encodeURIComponent(lng);
    const wurl = base + "/watch?k=" + k;

    $("who").textContent = name + " さん";
    $("profileUrl").value = purl;
    $("watchUrl").value = wurl;
    $("profile").href = purl;
    $("watch").href = wurl;
    $("mode").textContent = (lat && lng) ? "位置情報は指定座標に固定（許可不要）" : "位置情報は実測（許可が必要）";
    $("out").style.display = "block";

    $("copy").onclick = () => copy(purl, $("copy"));
    $("copy2").onclick = () => copy(wurl, $("copy2"));
  };
</script>
</body>
</html>
