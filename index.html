<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>リアルタイム位置ビューア</title>
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:#f8fafc;color:#0f172a;overflow:hidden;
  }
  #map{position:fixed;inset:0}

  header{
    position:fixed;top:0;left:0;right:0;z-index:1000;
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;
    padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));
    background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
    border-bottom:1px solid #e2e8f0;
  }
  header .title{font-size:14px;font-weight:600}
  header .spacer{flex:1}

  .badge{font-size:11px;padding:3px 10px;border-radius:999px;background:#e5e7eb;color:#374151;white-space:nowrap}
  .badge.live{background:#bbf7d0;color:#14532d}
  .badge.sim{background:#fde68a;color:#78350f}

  button{
    font:inherit;font-size:12px;padding:7px 14px;border-radius:8px;cursor:pointer;
    border:1px solid #d1d5db;background:#fff;color:#374151;
  }
  button.primary{background:#2563eb;border-color:#2563eb;color:#fff}
  button:active{transform:translateY(1px)}

  #panel{
    position:fixed;left:0;right:0;bottom:0;z-index:1000;
    padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.94);backdrop-filter:blur(8px);
    border-top:1px solid #e2e8f0;
  }
  #stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{border:1px solid #e5e7eb;border-radius:8px;padding:6px 9px}
  .stat .k{font-size:10px;opacity:.6}
  .stat .v{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;word-break:break-all}

  .hint{font-size:11px;opacity:.7;margin-top:8px;line-height:1.5}

  @media (prefers-color-scheme:dark){
    body{background:#0b1220;color:#e2e8f0}
    header,#panel{background:rgba(15,23,42,.92);border-color:#1e293b}
    .stat{border-color:#1e293b}
    button{background:#0f172a;color:#e2e8f0;border-color:#334155}
    button.primary{background:#2563eb;border-color:#2563eb;color:#fff}
    .badge{background:#1e293b;color:#cbd5e1}
  }
</style>
</head>
<body>
  <div id="map"></div>

  <header>
    <span class="title">リアルタイム位置</span>
    <span id="badge" class="badge">待機中</span>
    <span class="spacer"></span>
    <button id="followBtn">追従: ON</button>
    <button id="copyBtn">座標コピー</button>
    <button id="clearBtn">クリア</button>
    <button id="startBtn" class="primary">開始</button>
    <button id="stopBtn">停止</button>
  </header>

  <section id="panel">
    <div id="stats"></div>
    <div class="hint">
      位置情報の許可を求められたら「許可」を選んでください。許可が取れない環境では自動でシミュレーション移動に切り替わります。
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script>
  (function () {
    "use strict";

    /* ---------- 地図 ---------- */
    var dark = matchMedia("(prefers-color-scheme: dark)").matches;
    var tiles = dark
      ? "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key=cb1_2nve_1_afe1da6ca18e958f7724fb54"
      : "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=cb1_2nve_1_afe1da6ca18e958f7724fb54";

    var map = L.map("map", { zoomControl: false }).setView([35.6812, 139.7671], 16);
    L.control.zoom({ position: "bottomright" }).addTo(map);
    L.tileLayer(tiles, {
      attribution: "© OpenStreetMap © CartoDB",
      maxZoom: 19
    }).addTo(map);

    /* ---------- 状態 ---------- */
    var state = {
      follow: true,
      watchId: null,
      simTimer: null,
      simPos: null,
      path: [],
      marker: null,
      circle: null,
      line: null,
      count: 0,
      totalDist: 0,
      last: null,
      startedAt: null
    };

    var $ = function (id) { return document.getElementById(id); };
    var badge = $("badge");
    var statsEl = $("stats");

    function setBadge(text, cls) {
      badge.textContent = text;
      badge.className = "badge" + (cls ? " " + cls : "");
    }

    function haversine(a, b) {
      var R = 6371000, rad = Math.PI / 180;
      var dLat = (b[0] - a[0]) * rad, dLng = (b[1] - a[1]) * rad;
      var la1 = a[0] * rad, la2 = b[0] * rad;
      var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(la1) * Math.cos(la2) *
              Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return 2 * R * Math.asin(Math.sqrt(h));
    }

    function renderStats(o) {
      var rows = [
        ["緯度", o.lat.toFixed(6)],
        ["経度", o.lng.toFixed(6)],
        ["精度", "±" + Math.round(o.acc) + " m"],
        ["速度", o.spd == null ? "—" : (o.spd * 3.6).toFixed(1) + " km/h"],
        ["移動距離", (state.totalDist / 1000).toFixed(3) + " km"],
        ["点数", String(o.n)]
      ];
      statsEl.innerHTML = rows.map(function (r) {
        return '<div class="stat"><div class="k">' + r[0] +
               '</div><div class="v">' + r[1] + "</div></div>";
      }).join("");
    }

    function update(lat, lng, acc, spd, mode) {
      var pt = [lat, lng];
      if (state.last) {
        var d = haversine(state.last, pt);
        if (d < 1000) state.totalDist += d; // 跳躍を除外
      }
      state.last = pt;
      state.count++;

      if (!state.marker) {
        state.marker = L.marker(pt).addTo(map).bindPopup("現在地");
        state.circle = L.circle(pt, {
          radius: acc, color: "#2563eb", weight: 1,
          fillColor: "#3b82f6", fillOpacity: 0.12
        }).addTo(map);
        state.line = L.polyline([], {
          color: "#2563eb", weight: 4, opacity: 0.85, lineJoin: "round"
        }).addTo(map);
      } else {
        state.marker.setLatLng(pt);
        state.circle.setLatLng(pt).setRadius(acc);
      }

      state.path.push(pt);
      state.line.setLatLngs(state.path);
      if (state.follow) map.panTo(pt);

      renderStats({ lat: lat, lng: lng, acc: acc, spd: spd, n: state.count });
      setBadge(mode === "sim" ? "シミュレーション" : "ライブ（実測）", mode === "sim" ? "sim" : "live");
    }

    /* ---------- シミュレーション ---------- */
    function startSim() {
      if (state.simTimer) return;
      state.simPos = state.simPos || { lat: 35.6812, lng: 139.7671, dir: 0 };
      state.simTimer = setInterval(function () {
        var p = state.simPos;
        p.dir += (Math.random() - 0.5) * 0.6;
        var step = 0.00006;
        p.lat += Math.cos(p.dir) * step;
        p.lng += Math.sin(p.dir) * step;
        update(p.lat, p.lng, 8 + Math.random() * 6, 1.2 + Math.random() * 0.6, "sim");
      }, 1000);
    }

    function stopAll() {
      if (state.watchId != null) {
        navigator.geolocation.clearWatch(state.watchId);
        state.watchId = null;
      }
      if (state.simTimer) { clearInterval(state.simTimer); state.simTimer = null; }
    }

    /* ---------- 開始/停止 ---------- */
    function start() {
      stopAll();
      state.startedAt = Date.now();
      if (!("geolocation" in navigator)) { startSim(); return; }

      setBadge("取得中…");
      var got = false;
      state.watchId = navigator.geolocation.watchPosition(function (pos) {
        got = true;
        var c = pos.coords;
        update(c.latitude, c.longitude, c.accuracy, c.speed, "live");
      }, function () {
        if (!got) startSim();
      }, { enableHighAccuracy: true, maximumAge: 0, timeout: 8000 });

      setTimeout(function () { if (!got) startSim(); }, 3500);
    }

    function stop() { stopAll(); setBadge("停止"); }

    function clearTrack() {
      if (state.line) state.line.setLatLngs([]);
      state.path = [];
      state.count = 0;
      state.totalDist = 0;
      state.last = null;
      if (state.marker) { map.removeLayer(state.marker); state.marker = null; }
      if (state.circle) { map.removeLayer(state.circle); state.circle = null; }
      statsEl.innerHTML = "";
    }

    /* ---------- 画面スリープ防止 ---------- */
    var wakeLock = null;
    function keepAwake() {
      if (!("wakeLock" in navigator)) return;
      navigator.wakeLock.request("screen").then(function (l) { wakeLock = l; }).catch(function () {});
    }
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible" && wakeLock === null) keepAwake();
    });

    /* ---------- ボタン ---------- */
    $("startBtn").onclick = function () { start(); keepAwake(); };
    $("stopBtn").onclick = stop;
    $("clearBtn").onclick = clearTrack;
    $("followBtn").onclick = function () {
      state.follow = !state.follow;
      this.textContent = "追従: " + (state.follow ? "ON" : "OFF");
      if (state.follow && state.last) map.panTo(state.last);
    };
    $("copyBtn").onclick = function () {
      if (!state.last) return;
      var text = state.last[0].toFixed(6) + "," + state.last[1].toFixed(6);
      var done = function () {
        var b = $("copyBtn"), t = b.textContent;
        b.textContent = "コピー済";
        setTimeout(function () { b.textContent = t; }, 1200);
      };
      if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(done);
      else done();
    };

    /* ---------- 起動 ---------- */
    setTimeout(function () { map.invalidateSize(); }, 150);
    start();
  })();
  </script>
</body>
</html>
